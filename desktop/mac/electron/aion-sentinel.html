<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AION Security Sentinel</title><style>
:root{--glow:#42a5f5;--ink:#071526;--cloth:#173b69;--skin:#d8a16d;--band:#37aef5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,system-ui,sans-serif}.wrap{width:164px;height:190px;display:grid;place-items:end center;-webkit-app-region:drag;filter:drop-shadow(0 10px 13px #07152655)}button{border:0;background:transparent;padding:0;cursor:pointer;-webkit-app-region:no-drag}.fighter{position:relative;width:148px;height:174px;transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite}.head{position:absolute;left:42px;top:12px;width:67px;height:69px;border-radius:43% 46% 42% 44%;background:linear-gradient(145deg,#283d54,#071526 63%);border:3px solid var(--glow);box-shadow:0 0 16px color-mix(in srgb,var(--glow),transparent 30%);z-index:4}.hair{position:absolute;left:36px;top:3px;width:78px;height:34px;background:#101c2b;clip-path:polygon(0 62%,12% 18%,24% 46%,39% 0,51% 43%,66% 7%,76% 48%,100% 23%,91% 100%,5% 100%);z-index:6}.band{position:absolute;left:33px;top:26px;width:84px;height:9px;background:var(--band);z-index:7;transform:rotate(-3deg);box-shadow:0 0 9px var(--glow)}.band:after{content:"";position:absolute;right:-26px;top:2px;width:31px;height:6px;background:var(--band);transform:rotate(20deg);clip-path:polygon(0 0,100% 20%,77% 100%,0 80%)}.face{position:absolute;inset:21px 8px 8px;border-radius:38%;background:#081321;overflow:hidden}.eye{position:absolute;top:20px;width:17px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px 3px var(--glow);animation:scan 3s ease-in-out infinite}.eye.l{left:9px}.eye.r{right:9px}.mouth{position:absolute;left:21px;top:43px;width:13px;height:3px;border-radius:3px;background:var(--glow);opacity:.8}.torso{position:absolute;left:38px;top:73px;width:77px;height:71px;background:linear-gradient(90deg,#0b2038,var(--cloth),#08192e);clip-path:polygon(16% 0,84% 0,100% 31%,87% 100%,13% 100%,0 31%);z-index:3;border-top:3px solid var(--glow)}.belt{position:absolute;left:41px;top:127px;width:71px;height:10px;background:#07101d;border:2px solid var(--glow);z-index:5}.arm{position:absolute;top:80px;width:34px;height:65px;background:var(--cloth);border:2px solid var(--glow);border-radius:19px;z-index:2}.arm.l{left:15px;transform:rotate(28deg)}.arm.r{right:13px;transform:rotate(-31deg)}.glove{position:absolute;bottom:-3px;width:29px;height:27px;border-radius:48%;background:#071526;border:3px solid var(--glow)}.leg{position:absolute;top:133px;width:35px;height:38px;background:#0c2848;border:2px solid var(--glow);z-index:2}.leg.l{left:39px;transform:skew(-7deg)}.leg.r{right:35px;transform:skew(7deg)}.badge{position:absolute;left:60px;top:92px;z-index:8;color:var(--glow);font-size:18px;text-shadow:0 0 8px var(--glow)}.label{position:absolute;left:7px;right:7px;bottom:0;padding:4px 7px;background:#071526e8;color:white;border:1px solid var(--glow);border-radius:10px;text-align:center;font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:10}
body[data-state=observing]{--glow:#22d3ee;--band:#22d3ee}body[data-state=investigating]{--glow:#a855f7;--band:#a855f7}.investigating .fighter{animation:kata .8s ease-in-out infinite alternate}body[data-state=review]{--glow:#f59e0b;--band:#f59e0b}body[data-state=urgent]{--glow:#ef4444;--band:#ef4444}.urgent .fighter{animation:alert .45s ease-in-out infinite alternate}body[data-state=verified]{--glow:#22c55e;--band:#22c55e}body[data-state=offline]{--glow:#64748b;--band:#64748b;filter:grayscale(.7)}body[data-state=offline] .eye{height:2px;box-shadow:none}.shield{display:none}body[data-state=verified] .shield{display:inline}.sword{display:inline}body[data-state=verified] .sword{display:none}@keyframes breathe{50%{transform:translateY(-3px) scale(1.01)}}@keyframes scan{0%,100%{transform:translateX(-2px) scaleX(.8)}50%{transform:translateX(2px) scaleX(1.1)}}@keyframes alert{to{transform:translateY(-5px) rotate(-1deg)}}@keyframes kata{to{transform:translateX(3px) rotate(1deg)}}
</style></head><body data-state="offline"><div class="wrap"><button id="sentinel" aria-label="Open AION Cybersecurity" title="AION Security Sentinel"><div class="fighter"><div class="hair"></div><div class="band"></div><div class="head"><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div></div><div class="arm l"><i class="glove"></i></div><div class="arm r"><i class="glove"></i></div><div class="torso"></div><div class="badge"><span class="sword">◆</span><span class="shield">✓</span></div><div class="belt"></div><div class="leg l"></div><div class="leg r"></div><div class="label" id="label">Sentinel offline</div></div></button></div><script src="aion-sentinel.js"></script></body></html>
