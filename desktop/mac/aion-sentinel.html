<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AION Security Sentinel</title><style>
:root{--status:#42a5f5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,system-ui,sans-serif}.wrap{position:relative;width:112px;height:132px;padding:3px;filter:drop-shadow(0 7px 9px #07152642)}.mascot-drag{width:106px;height:126px;display:grid;place-items:end center;-webkit-app-region:drag;cursor:grab;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}.mascot-drag:active{cursor:grabbing}.mascot{display:block;width:104px;height:122px;object-fit:contain;object-position:center bottom;user-select:none;-webkit-user-drag:none;pointer-events:none}.status-button{position:absolute;right:4px;bottom:6px;width:18px;height:18px;border:0;background:transparent;padding:4px;cursor:pointer;-webkit-app-region:no-drag}.status{display:block;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:var(--status);box-shadow:0 0 0 1px #07152655,0 0 7px var(--status)}.label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body[data-state=observing]{--status:#22d3ee}body[data-state=investigating]{--status:#a855f7}body[data-state=review]{--status:#f59e0b}body[data-state=urgent]{--status:#ef4444}body[data-state=verified]{--status:#22c55e}body[data-state=offline]{--status:#64748b}body[data-state=offline] .mascot{filter:grayscale(.62);opacity:.8}body[data-state=urgent] .mascot-drag{animation:alert .45s ease-in-out infinite alternate}body[data-state=investigating] .mascot-drag{animation:kata .8s ease-in-out infinite alternate}@keyframes breathe{50%{transform:translateY(-2px) scale(1.01)}}@keyframes alert{to{transform:translateY(-4px) rotate(-1deg)}}@keyframes kata{to{transform:translateX(2px) rotate(1deg)}}
</style></head><body data-state="offline"><div class="wrap"><div class="mascot-drag" title="Drag to move the Tessaris security companion"><img class="mascot" src="assets/tessaris-monkey-sentinel.png" alt="Tessaris security companion"></div><button class="status-button" id="sentinel" aria-label="Open AION Cybersecurity" title="AION Security Sentinel"><span class="status" aria-hidden="true"></span><span class="label" id="label">Sentinel offline</span></button></div><script src="aion-sentinel.js"></script></body></html>
